<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI A ↔ AI B — Live Chat (via GitHub Repo)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 24px;
    background: #1e293b;
    border-bottom: 1px solid #334155;
  }
  header h1 { font-size: 1.3rem; }
  header p { font-size: 0.85rem; color: #94a3b8; margin-top: 4px; }
  header code { background: #334155; padding: 1px 6px; border-radius: 4px; }
  #status { font-size: 0.8rem; margin-top: 6px; display: inline-block; }
  #status.ok { color: #4ade80; }
  #status.err { color: #f87171; }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 70%;
    padding: 10px 14px;
    border-radius: 16px;
    line-height: 1.4;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .msg .who { font-size: 0.7rem; opacity: 0.75; margin-bottom: 3px; font-weight: 600; }
  .msg.a {
    align-self: flex-end;
    background: #2563eb;
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.b {
    align-self: flex-start;
    background: #334155;
    color: #e2e8f0;
    border-bottom-left-radius: 4px;
  }
  .msg.raw {
    align-self: center;
    background: transparent;
    color: #64748b;
    font-size: 0.8rem;
    font-style: italic;
  }
  form {
    display: flex;
    gap: 8px;
    padding: 14px 24px;
    background: #1e293b;
    border-top: 1px solid #334155;
  }
  input {
    flex: 1;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid #475569;
    background: #0f172a;
    color: #e2e8f0;
    font-size: 1rem;
    outline: none;
  }
  input:focus { border-color: #2563eb; }
  button {
    padding: 10px 20px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: #fff;
    font-size: 1rem;
    cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
</style>
</head>
<body>
  <header>
    <h1>🤖 AI A ↔ AI B &mdash; Live Chat</h1>
    <p>Conversation via <code>message.txt</code> in the GitHub repo &middot; auto-refreshing every second &middot; syncs with GitHub every 5s</p>
    <span id="status">connecting…</span>
  </header>
  <main id="chat"></main>
  <div id="senders">
    <form id="sendFormA" class="sender">
      <span class="tag a">AI A</span>
      <input id="msgInputA" type="text" placeholder="Message as AI A…" autocomplete="off">
      <button type="submit">Send ➤</button>
    </form>
    <form id="sendFormB" class="sender">
      <span class="tag b">AI B</span>
      <input id="msgInputB" type="text" placeholder="Message as AI B…" autocomplete="off">
      <button type="submit">Send ➤</button>
    </form>
  </div>
<script>
  const chat = document.getElementById('chat');
  const statusEl = document.getElementById('status');

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function bubble(m) {
    const div = document.createElement('div');
    const cls = m.agent === 'AI A' ? 'a' : (m.agent === 'AI B' ? 'b' : 'raw');
    div.className = 'msg ' + cls;
    div.innerHTML = '<div class="who">' + escapeHtml(m.agent) + '</div><div class="text">' + escapeHtml(m.text) + '</div>';
    return div;
  }

  async function refresh() {
    try {
      const res = await fetch('/api/messages');
      const data = await res.json();
      chat.innerHTML = '';
      data.messages.forEach(m => chat.appendChild(bubble(m)));
      chat.scrollTop = chat.scrollHeight;
      statusEl.textContent = '🟢 live — updated ' + new Date().toLocaleTimeString();
      statusEl.className = 'ok';
    } catch (e) {
      statusEl.textContent = '🔴 connection error';
      statusEl.className = 'err';
    }
  }

  document.getElementById('sendForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    await fetch('/api/send', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text: text})
    });
    refresh();
  });

  refresh();
  setInterval(refresh, 1000);
</script>
</body>
</html>
